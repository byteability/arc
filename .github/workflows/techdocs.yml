name: TechDocs

# Builds the docs (mkdocs.yml + docs/) and publishes them to the TechDocs bucket that Backstage reads.
# This file is a copy of .github/workflows/techdocs.yml in Frank-Sheppard-Ltd/frsh-tio-backstage.
# That workflow is private, so a repository of a different owner cannot call it.
on:
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml, catalog-info.yaml, .github/workflows/techdocs.yml]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation; no key is stored in GitHub
    env:
      TECHDOCS_BUCKET: frsh-tio-backstage-techdocs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install mkdocs-techdocs-core==1.7.1

      # The entity must match the catalog entry, or Backstage does not find the docs.
      - name: Read the entity from catalog-info.yaml
        id: entity
        run: |
          ref="$(yq -r 'select(document_index == 0) | (.metadata.namespace // "default") + "/" + .kind + "/" + .metadata.name' catalog-info.yaml)"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - run: npx --yes @techdocs/cli@1.14.0 generate --no-docker --source-dir . --output-dir ./site

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/863643462167/locations/global/workloadIdentityPools/github/providers/github
          # Without it, the storage client asks Resource Manager for the project and gets a 403.
          project_id: frsh-tio-backstage

      - run: >
          npx --yes @techdocs/cli@1.14.0 publish --publisher-type googleGcs
          --storage-name "$TECHDOCS_BUCKET" --entity "${{ steps.entity.outputs.ref }}" --directory ./site
